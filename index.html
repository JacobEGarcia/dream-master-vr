<script type="module">
import * as THREE from 'three';

/* ============================== utils ============================== */
const $=id=>document.getElementById(id);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const TAU=Math.PI*2;

function typewriter(el,text,speed=22,done){
  el.textContent='';let i=0;el.dataset.typing='1';
  const t=setInterval(()=>{
    el.textContent=text.slice(0,++i);
    if(i>=text.length){clearInterval(t);delete el.dataset.typing;done&&done();}
  },speed);
  return t;
}

/* ============================== audio ============================== */
const AudioSys={
  ctx:null,muted:false,master:null,droneGain:null,windGain:null,wormOsc:null,wormGain:null,heartTimer:null,
  init(){
    if(this.ctx)return;
    const C=this.ctx=new (window.AudioContext||window.webkitAudioContext)();
    this.master=C.createGain();this.master.gain.value=.8;this.master.connect(C.destination);
  },
  setMuted(m){this.muted=m;if(this.master)this.master.gain.value=m?0:.8;},
  now(){return this.ctx.currentTime;},
  env(g,t0,a,peak,dur){g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(peak,t0+a);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);},
  tone(freq,type,dur,peak=.2,when=0,slide=0){
    if(!this.ctx)return;const C=this.ctx,t0=this.now()+when;
    const o=C.createOscillator(),g=C.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t0);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),t0+dur);
    this.env(g,t0,.01,peak,dur);o.connect(g);g.connect(this.master);o.start(t0);o.stop(t0+dur+.05);
  },
  noiseBuf:null,
  noise(dur,peak=.15,freq=1200,q=.8,when=0){
    if(!this.ctx)return;const C=this.ctx,t0=this.now()+when;
    if(!this.noiseBuf){const b=C.createBuffer(1,C.sampleRate*2,C.sampleRate),d=b.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.noiseBuf=b;}
    const s=C.createBufferSource();s.buffer=this.noiseBuf;s.loop=true;
    const f=C.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;
    const g=C.createGain();this.env(g,t0,.02,peak,dur);
    s.connect(f);f.connect(g);g.connect(this.master);s.start(t0);s.stop(t0+dur+.05);
  },
  startDream(){
    if(!this.ctx)return;const C=this.ctx,t0=this.now();
    this.stopDream();
    const o1=C.createOscillator(),o2=C.createOscillator(),g=C.createGain();
    o1.type='sine';o1.frequency.value=55;o2.type='sine';o2.frequency.value=55*1.007;
    g.gain.value=0;g.gain.linearRampToValueAtTime(.16,t0+3);
    const lfo=C.createOscillator(),lg=C.createGain();
    lfo.frequency.value=.07;lg.gain.value=.06;lfo.connect(lg);lg.connect(g.gain);
    o1.connect(g);o2.connect(g);g.connect(this.master);
    o1.start();o2.start();lfo.start();
    const wn=C.createBufferSource();wn.buffer=this.noiseBuf||(this.noise(.1),this.noiseBuf);wn.loop=true;
    const wf=C.createBiquadFilter();wf.type='bandpass';wf.frequency.value=500;wf.Q.value=.4;
    const wg=C.createGain();wg.gain.value=0;wg.gain.linearRampToValueAtTime(.05,t0+4);
    const wlfo=C.createOscillator(),wlg=C.createGain();
    wlfo.frequency.value=.11;wlg.gain.value=300;wlfo.connect(wlg);wlg.connect(wf.frequency);
    wn.connect(wf);wf.connect(wg);wg.connect(this.master);wn.start();wlfo.start();
    // worm growl, silent until hunting
    const wo=C.createOscillator(),wg2=C.createGain(),wf2=C.createBiquadFilter();
    wo.type='sawtooth';wo.frequency.value=38;wf2.type='lowpass';wf2.frequency.value=160;
    wg2.gain.value=0;wo.connect(wf2);wf2.connect(wg2);wg2.connect(this.master);wo.start();
    this.wormGain=wg2;
    // heartbeat
    const beat=()=>{if(!this._dreamOn)return;
      const rate=lerp(1.6,.55,this._inst/100);
      this.tone(52,'sine',.12,.16*this._inst/100+.03);this.tone(48,'sine',.1,.12*this._inst/100+.02,.18);
      this.heartTimer=setTimeout(beat,rate*1000);};
    this._dreamOn=true;beat();
    this._dreamNodes=[o1,o2,lfo,wn,wlfo,wo];
    this.droneGain=g;this.windGain=wg;
  },
  stopDream(){
    this._dreamOn=false;clearTimeout(this.heartTimer);
    if(this._dreamNodes){const t=this.now();
      if(this.droneGain)this.droneGain.gain.linearRampToValueAtTime(0,t+1.5);
      if(this.windGain)this.windGain.gain.linearRampToValueAtTime(0,t+1.5);
      if(this.wormGain)this.wormGain.gain.linearRampToValueAtTime(0,t+1);
      this._dreamNodes.forEach(n=>{try{n.stop(t+1.6)}catch(e){}});this._dreamNodes=null;}
  },
  _inst:25,_dreamOn:false,
  setInstability(v){this._inst=v;if(this.wormGain)this.wormGain.gain.linearRampToValueAtTime(v>45?.07:0,this.now()+.8);},
  uiClick(){this.tone(660,'square',.07,.08);},
  grab(){this.tone(392,'sine',.3,.18);this.tone(523,'sine',.3,.12,.06);},
  release(){this.tone(330,'sine',.2,.1);},
  chime(i){const f=[523,587,659,784,880,1047][i%6];
    this.tone(f,'sine',1.2,.22);this.tone(f*1.5,'sine',1.4,.12,.08);this.tone(f*2,'triangle',1,.07,.15);
    this.noise(1.5,.06,3000,2,.1);},
  spike(){this.noise(.5,.3,300,1);this.tone(90,'sawtooth',.5,.25,0,-40);},
  repelLoop(on){
    if(on&&!this._repel){this._repel=true;this.tone(880,'sine',.15,.06);
      this._repelInt=setInterval(()=>this.tone(880+Math.random()*60,'sine',.15,.045),160);}
    else if(!on&&this._repel){this._repel=false;clearInterval(this._repelInt);}
  },
  collapse(){this.noise(2.5,.4,200,.6);this.tone(220,'sawtooth',2.5,.3,0,-190);
    this.tone(110,'square',2.5,.2,.3,-90);},
  win(){const n=[261,329,392,523,659,784];
    n.forEach((f,i)=>{this.tone(f,'sine',3,.16,i*.18);this.tone(f*2,'triangle',2.4,.06,i*.18+.1);});
    this.noise(3,.08,4000,1,.5);},
  jackIn(){this.tone(1200,'sine',1.4,.12,0,-1100);this.noise(1.2,.15,2400,.7);},
};
$('muteBtn').addEventListener('click',e=>{e.stopPropagation();AudioSys.init();
  AudioSys.setMuted(!AudioSys.muted);$('muteBtn').textContent=AudioSys.muted?'SOUND OFF':'SOUND ON';});

function drawHud(shaped,inst){

  c.fillStyle=g;c.fillRect(10,66,(492)*clamp(inst,0,100)/100,16);

/* ============================== input state ============================== */
const Input={keys:{},locked:false,yaw:0,pitch:0,press:false,pressEdge:false,focusHeld:false,
  moveVec:new THREE.Vector3()};
addEventListener('keydown',e=>{Input.keys[e.code]=true;});
addEventListener('keyup',e=>{Input.keys[e.code]=false;});
const gl=renderer.domElement;
gl.addEventListener('click',()=>{
  if((state==='dream'||state==='office')&&!renderer.xr.isPresenting&&!Input.locked)gl.requestPointerLock();
});
document.addEventListener('pointerlockchange',()=>{
  Input.locked=document.pointerLockElement===gl;
  $('crosshair').style.display=(Input.locked&&(state==='dream'||state==='office'))?'block':'none';
});
addEventListener('mousemove',e=>{
  if(!Input.locked)return;
  Input.yaw-=e.movementX*.0022;Input.pitch=clamp(Input.pitch-e.movementY*.0022,-1.4,1.4);
});
addEventListener('mousedown',e=>{if(Input.locked){if(e.button===0)Input.press=true;}});
addEventListener('mouseup',e=>{if(e.button===0)Input.press=false;});
/* touch fallback: drag to look, bottom half = move stick, top-right button zone = press */
const Touch={lookId:-1,moveId:-1,lx:0,ly:0,mx:0,my:0,dx:0,dy:0};
addEventListener('touchstart',e=>{
  for(const t of e.changedTouches){
    if(t.clientY>innerHeight*.55&&t.clientX<innerWidth*.5&&Touch.moveId<0){Touch.moveId=t.identifier;Touch.mx=t.clientX;Touch.my=t.clientY;}
    else if(Touch.lookId<0){Touch.lookId=t.identifier;Touch.lx=t.clientX;Touch.ly=t.clientY;}
  }
},{passive:false});
addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===Touch.lookId){Input.yaw-=(t.clientX-Touch.lx)*.005;
      Input.pitch=clamp(Input.pitch-(t.clientY-Touch.ly)*.005,-1.4,1.4);
      Touch.lx=t.clientX;Touch.ly=t.clientY;}
    if(t.identifier===Touch.moveId){Touch.dx=clamp((t.clientX-Touch.mx)/60,-1,1);
      Touch.dy=clamp((t.clientY-Touch.my)/60,-1,1);}
  }
},{passive:false});
addEventListener('touchend',e=>{
  for(const t of e.changedTouches){
    if(t.identifier===Touch.lookId){Touch.lookId=-1;Input.press=true;setTimeout(()=>Input.press=false,120);}
    if(t.identifier===Touch.moveId){Touch.moveId=-1;Touch.dx=Touch.dy=0;}
  }
});
addEventListener('contextmenu',e=>e.preventDefault());

/* ============================== text canvas helper ============================== */
function textTexture(lines,{w=1024,h=512,size=44,color='#cfd2e8',glow='#7b6cff'}={}){
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const c=cv.getContext('2d');
  c.fillStyle='#08070f';c.fillRect(0,0,w,h);
  c.strokeStyle='#3a3860';c.lineWidth=4;c.strokeRect(8,8,w-16,h-16);
  c.font=size+'px "Courier New",monospace';c.fillStyle=color;
  c.shadowColor=glow;c.shadowBlur=14;c.textAlign='center';
  lines.forEach((l,i)=>c.fillText(l,w/2,h/2+(i-(lines.length-1)/2)*(size*1.6)));
  const t=new THREE.CanvasTexture(cv);return t;
}

{

/* noise + terrain */
function h2(x,z){const s=Math.sin(x*127.1+z*311.7)*43758.5453;return s-Math.floor(s);}
function vnoise(x,z){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi,
  u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
  return lerp(lerp(h2(xi,zi),h2(xi+1,zi),u),lerp(h2(xi,zi+1),h2(xi+1,zi+1),u),v);}
function fbm(x,z){return vnoise(x,z)*.6+vnoise(x*2.1,z*2.1)*.3+vnoise(x*4.3,z*4.3)*.1;}

const terrainUniforms={uTime:{value:0},uMorph:{value:1},
  uLow:{value:new THREE.Color(0x1e1632)},uHigh:{value:new THREE.Color(0x7a62b3)},
  uFogColor:{value:new THREE.Color(0x352a4d)},uFogDensity:{value:.016}};
function terrainHeight(x,z,t,morph){
  return (fbm(x*.05,z*.05)-.5)*7*morph
    +Math.sin(x*.11+t*.4)*Math.cos(z*.13+t*.31)*1.2*morph
    +Math.sin(x*.023+t*.07)*2.2*morph;
}
const terrGeo=new THREE.PlaneGeometry(180,180,110,110);

  uniforms:terrainUniforms,
  vertexShader:`
    uniform float uTime,uMorph;varying float vH;varying vec3 vW;
    float h2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    float vn(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);
      return mix(mix(h2(i),h2(i+vec2(1,0)),u.x),mix(h2(i+vec2(0,1)),h2(i+vec2(1,1)),u.x),u.y);}
    float fbm(vec2 p){return vn(p)*.6+vn(p*2.1)*.3+vn(p*4.3)*.1;}
    void main(){
      vec3 p=position;
      vec2 xz=p.xz;
      float h=(fbm(xz*.05)-.5)*7.*uMorph
        +sin(xz.x*.11+uTime*.4)*cos(xz.y*.13+uTime*.31)*1.2*uMorph
        +sin(xz.x*.023+uTime*.07)*2.2*uMorph;
      p.y=h;vH=h;
      vec4 w=modelMatrix*vec4(p,1.);vW=w.xyz;
      gl_Position=projectionMatrix*viewMatrix*w;
    }`,
  fragmentShader:`
    uniform vec3 uLow,uHigh,uFogColor;uniform float uFogDensity,uTime;varying float vH;varying vec3 vW;
    float hf(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    void main(){
      float t=smoothstep(-3.5,3.5,vH);
      vec3 col=mix(uLow,uHigh,t);
      float sparkle=step(.996,hf(floor(vW.xz*4.)+floor(uTime*2.)*.13));
      col+=sparkle*.55;
      float d=length(vW-cameraPosition);
      float f=1.-exp(-uFogDensity*uFogDensity*d*d);
      gl_FragColor=vec4(mix(col,uFogColor,clamp(f,0.,1.)),1.);
    }`,
});

const wormTarget=new THREE.Vector3(20,8,20);
function wormUpdate(dt,t,inst,playerPos){
  const on=inst>45;
  for(const s of worm.segs)s.visible=on;
  if(!on)return;
  worm.hunting=inst>60;
  if(worm.hunting){
    wormTarget.lerp(playerPos.clone().add(new THREE.Vector3(Math.sin(t*1.7)*3,1.2,Math.cos(t*2.3)*3)),dt*1.5);
  }else{
    if(worm.head.position.distanceTo(wormTarget)<6||Math.random()<.002)
      wormTarget.set(rand(-30,30),rand(4,14),rand(-30,30));
  }
  const speed=(worm.hunting?lerp(4,9,(inst-60)/40):3.2);
  if(worm.repelT>0){worm.repelT-=dt;
    const away=worm.head.position.clone().sub(playerPos).normalize();
    wormTarget.copy(worm.head.position).add(away.multiplyScalar(20));}
  const dir=wormTarget.clone().sub(worm.head.position);
  const d=dir.length();
  if(d>.01)worm.head.position.add(dir.normalize().multiplyScalar(Math.min(speed*dt,d)));
  worm.head.position.y+=Math.sin(t*3)*dt*2;
  for(let i=1;i<20;i++){
    const prev=worm.segs[i-1].position,cur=worm.segs[i].position;
    const gap=.62*(1-i/40);
    const delta=prev.clone().sub(cur),L=delta.length();
    if(L>gap)cur.copy(prev).sub(delta.normalize().multiplyScalar(gap));
  }
  worm.segs[20].position.copy(worm.head.position).add(new THREE.Vector3(-.2,.15,-.3));
  worm.segs[21].position.copy(worm.head.position).add(new THREE.Vector3(.2,.15,-.3));
  const hd=worm.head.position.distanceTo(playerPos.clone().setY(playerPos.y+1.4));
  worm.hitCooldown-=dt;
  if(hd<1.6&&worm.hitCooldown<=0){
    worm.hitCooldown=2.2;spike(14);AudioSys.spike();toast('THE WORM TURNS');
  }
}

  for(const s of shards){
    if(s.userData.state!=='idle')continue;
    const d=s.position.distanceTo(pos);
    if(d<bd){bd=d;best=s;}
  }

  for(const s of sockets){
    if(s.userData.filled)continue;
    const d=s.position.distanceTo(pos);
    if(d<bd){bd=d;best=s;}
  }
  return best;
}

  const sk=sockets[carried.userData.index];
  if(sk.userData.filled)return false;
  if(carried.position.distanceTo(sk.position)<2.4){
    sk.userData.filled=true;
    carried.userData.state='socketed';

    rig.position.set(0,0,6);
    Input.yaw=0;Input.pitch=.15;
    setPalette(0);
    for(const key of Object.keys(curPal))curPal[key].copy(tgtPal[key]);
    terrainUniforms.uLow.value.copy(curPal.low);
    terrainUniforms.uHigh.value.copy(curPal.high);
    terrainUniforms.uMorph.value=1;
    $('hud').style.display='block';
    hudMesh.visible=renderer.xr.isPresenting;
    AudioSys.startDream();AudioSys.setInstability(25);
    toast('YOU ARE INSIDE HER DREAM');
  });
}
/* --- collapse --- */
function collapseSequence(){
  if(game.ended)return;game.ended=true;
  AudioSys.collapse();AudioSys.stopDream();AudioSys.repelLoop(false);
  state='collapsing';
  fade(true,false,()=>{
    $('endTitle').textContent='THE DREAM COLLAPSES';
    $('endCap').textContent='';
    $('endScreen').classList.remove('hidden');
    typewriter($('endCap'),
      'The eye closes. The worm has her.\n\nYou surface gasping in the office chair, crown still warm.\nRender lights a cigarette with shaking hands.\n\nShe is still down there, blind in the dark.\nShe will let you try again.',
      20);
    $('hud').style.display='none';hudMesh.visible=false;
    dream.visible=false;renderer.setClearColor(0x030207);scene.fog=null;
    state='end';
  });
}
/* --- win --- */
function winSequence(){
  if(game.ended)return;game.ended=true;
  AudioSys.win();AudioSys.stopDream();AudioSys.repelLoop(false);
  state='winning';
  eyeGroup.userData.iris.visible=true;eyeGroup.userData.pupil.visible=true;
  setPalette(6);
  fade(false,true,()=>{
    $('endTitle').textContent='SHE SEES.';
    $('endCap').textContent='';
    $('endScreen').classList.remove('hidden');
    typewriter($('endCap'),
      'Light floods the dream - every color at once, all of them new.\nShe looks at her own hands and laughs, and the laugh is sight.\n\nYou withdraw the crown. Session complete.\n\n"Whatever worlds I shape," Render says to no one,\n"this one was hers."',
      20);
    $('hud').style.display='none';hudMesh.visible=false;
    state='end';
  });
}

/* ============================== interaction (shared VR/desktop) ============================== */
function pressAt(worldPos,worldDir,isVR){
  if(state==='office'){
    // jack button: ray hit or proximity
    raycaster.far=Infinity;
    raycaster.set(worldPos,worldDir);
    const hit=raycaster.intersectObject(office.userData.button,false);
    const near=office.userData.button.getWorldPosition(tmpV2).distanceTo(worldPos)<(isVR?.6:0);
    if(hit.length||near){AudioSys.uiClick();jackIn();}
    return;
  }
  if(state!=='dream'||game.ended)return;
  // VR hands: grab nearest shard in reach, or place carried
  if(isVR){
    for(const c of controllers){
      const ud=c.userData;
      const hp=c.getWorldPosition(tmpV2);
      if(ud.held){
        ud.held.userData.state='carried';
        if(tryPlace(ud.held)){const s=ud.held;ud.held=null;attachToSocket(s);}
        else{ud.held.userData.state='idle';ud.held.userData.home.copy(ud.held.position);ud.held=null;AudioSys.release();}
      }else{
        const s=nearestShard(hp,1.1);
        if(s){s.userData.state='held';ud.held=s;AudioSys.grab();}
      }
    }
  }else{
    // desktop: interact with best candidate along view ray within 6m
    if(desktopHeld){
      desktopHeld.userData.state='carried';
      if(tryPlace(desktopHeld)){const s=desktopHeld;desktopHeld=null;attachToSocket(s);}
      else{desktopHeld.userData.state='idle';desktopHeld.userData.home.copy(desktopHeld.position);desktopHeld=null;AudioSys.release();}
    }else{
      raycaster.set(worldPos,worldDir);raycaster.far=7;
      const hits=raycaster.intersectObjects(shards.filter(s=>s.userData.state==='idle'),true);
      if(hits.length){
        let o=hits[0].object;while(o.parent&&!shards.includes(o))o=o.parent;
        if(shards.includes(o)){o.userData.state='held';desktopHeld=o;AudioSys.grab();}
      }
    }
  }
}
let desktopHeld=null;
function attachToSocket(shard){
  const sk=sockets[shard.userData.index];
  shard.position.copy(sk.position);
  shard.userData.home.copy(sk.position);
  sk.userData.ring.material.emissiveIntensity=2.2;
  sk.userData.ring.material.color.set(0xd8ccff);
  sk.userData.label.visible=false;
}

/* ============================== main loop ============================== */
const clock=new THREE.Clock();
let pressWasDown=false;

function updateDesktop(dt){
  // movement
  const sp=4;
  const fwd=new THREE.Vector3(-Math.sin(Input.yaw),0,-Math.cos(Input.yaw));
  const right=new THREE.Vector3(-fwd.z,0,fwd.x);
  const mv=new THREE.Vector3();
  if(Input.keys['KeyW']||Input.keys['ArrowUp'])mv.add(fwd);
  if(Input.keys['KeyS']||Input.keys['ArrowDown'])mv.sub(fwd);
  if(Input.keys['KeyD']||Input.keys['ArrowRight'])mv.add(right);
  if(Input.keys['KeyA']||Input.keys['ArrowLeft'])mv.sub(right);
  mv.add(fwd.clone().multiplyScalar(-Touch.dy)).add(right.clone().multiplyScalar(Touch.dx));
  if(mv.lengthSq()>0)mv.normalize().multiplyScalar(sp*dt);
  rig.position.add(mv);
  rig.position.x=clamp(rig.position.x,-80,80);
  rig.position.z=clamp(rig.position.z,-80,80);
  // hover height over dream terrain
  if(state==='dream'){
    const gy=groundY(rig.position.x,rig.position.z);
    rig.position.y=lerp(rig.position.y,gy+1.62,dt*8);
  }
  camera.rotation.set(Input.pitch,Input.yaw,0,'YXZ');
  // focus beam (hold Shift or right mouse? use holding F)
  Input.focusHeld=!!Input.keys['KeyF'];
}

function updateVR(dt){
  if(state==='office')rig.position.y=0; // local-floor: headset provides height
  // stick locomotion
  const session=renderer.xr.getSession&&renderer.xr.getSession();
  if(session){
    for(const src of session.inputSources){
      if(!src.gamepad)continue;
      const ax=src.gamepad.axes;
      const x=ax[2]||ax[0]||0,y=ax[3]||ax[1]||0;
      if(Math.abs(x)+Math.abs(y)>.15){
        const dir=camera.getWorldDirection(tmpV);
        dir.y=0;dir.normalize();
        const right=new THREE.Vector3(-dir.z,0,dir.x);
        rig.position.add(dir.multiplyScalar(-y*3*dt)).add(right.multiplyScalar(x*3*dt));
      }
    }
  }
  if(state==='dream'){
    const gy=groundY(rig.position.x,rig.position.z);
    rig.position.y=lerp(rig.position.y,gy+1.62,dt*8);
  }
  // beams & focus
  let focusOn=false;
  for(const c of controllers){
    const ud=c.userData;
    const beam=beams[ud.index];
    if(state==='dream'&&!game.ended){
      const targeting=worm.active||worm.hunting;
      beam.visible=true;
      beam.material.opacity=ud.pressed?.6:.25;
      if(ud.pressed&&worm.hunting){
        // check aim at worm head
        const hp=c.getWorldPosition(tmpV2);
        const dir=c.getWorldDirection(tmpV);
        const toWorm=worm.head.position.clone().sub(hp);
        const d=toWorm.length();
        if(d<26&&toWorm.normalize().dot(dir)>.92){
          worm.repelT=.8;focusOn=true;
        }
      }
    }else beam.visible=false;
    // trigger press edges
    if(ud.pressed&&!pressWasDown){
      const hp=c.getWorldPosition(tmpV2.clone());
      const dir=c.getWorldDirection(new THREE.Vector3());
      pressAt(hp,dir,true);
    }
  }
  repelActive=focusOn;
  if(controllers.some(c=>c.userData.pressed))pressWasDown=true;else pressWasDown=false;
}

function animate(){
  const dt=Math.min(clock.getDelta(),.05);
  const t=clock.elapsedTime;
  const isVR=renderer.xr.isPresenting;

  if(state==='office'){
    office.userData.crown.rotation.z+=dt*.4;
    office.userData.button.material.emissiveIntensity=1.2+Math.sin(t*3)*.6;
    office.userData.dust.rotation.y+=dt*.02;
    office.userData.btnLabel.lookAt(camera.getWorldPosition(tmpV2));
  }
  if(state==='dream'||state==='collapsing'||state==='winning'){
    terrainUniforms.uTime.value=t;
    terrainUniforms.uMorph.value=lerp(1,1.9,game.instability/100);
    applyPalette(dt);
    terrainUniforms.uLow.value.copy(curPal.low);
    terrainUniforms.uHigh.value.copy(curPal.high);
    terrainUniforms.uFogColor.value.copy(curPal.fog);
    // islands bob
    for(const g of islands){
      g.position.y=g.userData.baseY+Math.sin(t*g.userData.spd+g.userData.ph)*1.2;
      g.rotation.y+=g.userData.rot*dt;
    }
    // eye
    eyeGroup.userData.ring.rotation.z+=dt*.3;
    eyeGroup.position.y=16+Math.sin(t*.5)*.8;
    eyeGroup.lookAt(camera.getWorldPosition(tmpV2));
    if(state==='winning'){
      eyeGroup.userData.iris.material.emissiveIntensity=2+Math.sin(t*4)*.8;
    }
    // sockets pulse, labels face player
    for(const sk of sockets){
      if(!sk.userData.filled)
        sk.userData.ring.material.emissiveIntensity=1.1+Math.sin(t*2.5+sk.userData.index)*.5;
      sk.userData.label.visible&&!sk.userData.filled&&sk.userData.label.lookAt(camera.getWorldPosition(tmpV2));
    }
    // shards
    for(const sh of shards){
      const ud=sh.userData;
      if(ud.state==='idle'){
        sh.position.y=ud.home.y+Math.sin(t*1.4+ud.ph)*.25;
        sh.rotation.y+=dt*.8;
        ud.mat.emissiveIntensity=1.3+Math.sin(t*6+ud.ph)*.5;
      }else if(ud.state==='held'){
        // carried: follow holder
        let target=null;
        if(isVR){for(const c of controllers)if(c.userData.held===sh)
          target=c.getWorldPosition(new THREE.Vector3()).add(c.getWorldDirection(new THREE.Vector3()).multiplyScalar(.25));}
        else if(desktopHeld===sh)
          target=camera.getWorldPosition(new THREE.Vector3()).add(camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(1.1));
        if(target)sh.position.lerp(target,dt*14);
        sh.rotation.y+=dt*2;ud.mat.emissiveIntensity=1.6;
        // proximity hint on its socket
        const sk=sockets[ud.index];
        const near=sh.position.distanceTo(sk.position)<2.4;
        sk.userData.ring.material.emissiveIntensity=near?3.5:1.1;
      }else if(ud.state==='socketed'){
        ud.placing=(ud.placing||0)+dt;
        const k=Math.min(ud.placing*2,1);
        sh.scale.setScalar(1+Math.sin(k*Math.PI)*.6);
        sh.rotation.y+=dt*.4;
        ud.mat.emissiveIntensity=2;
      }
    }
    // instability rise
    if(state==='dream'&&!game.ended){
      game.instability=clamp(game.instability+dt*(0.55+game.shaped*.12),0,100);
      AudioSys.setInstability(game.instability);
      if(game.instability>=100)collapseSequence();
    }
    worm.active=game.instability>45;
    wormUpdate(dt,t,game.instability,playerWorldPos());
    // HUD
    const instR=Math.round(game.instability);
    $('hudShaped').textContent='SHAPED '+game.shaped+' / 6';
    $('hudInst').textContent='DREAM INSTABILITY '+instR+'%';
    $('meter').style.width=game.instability+'%';
    if(isVR&&(state==='dream'))drawHud(game.shaped,game.instability);
  }

  // desktop focus beam repel
  if(!isVR&&state==='dream'&&!game.ended&&Input.focusHeld&&worm.hunting){
    const hp=camera.getWorldPosition(new THREE.Vector3());
    const hd=camera.getWorldDirection(new THREE.Vector3());
    const toWorm=worm.head.position.clone().sub(hp);
    if(toWorm.length()<30&&toWorm.normalize().dot(hd)>.9){worm.repelT=.8;repelActive=true;}
  }
  AudioSys.repelLoop(repelActive);
  repelActive=false;
  // desktop press edge
  if(!isVR){
    if(Input.press&&!pressWasDown){
      const pos=camera.getWorldPosition(new THREE.Vector3());
      const dir=camera.getWorldDirection(new THREE.Vector3());
      pressAt(pos,dir,false);
    }
    pressWasDown=Input.press;
    if(state==='dream'||state==='office')updateDesktop(dt);
  }else{
    updateVR(dt);
  }
  renderer.render(scene,camera);
}
renderer.setAnimationLoop(animate);

/* ============================== overlays & boot ============================== */
const TITLE_TEXT='The patient is blind. The therapist enters her dream\nto teach her what sight is.\n\nYou are the Shaper. You are not God in there -\nyou are a visitor holding a candle.\nKeep it lit.';
typewriter($('titleCap'),TITLE_TEXT,20,()=>$('titlePrompt').classList.add('show'));

function titleAdvance(){
  if(state!=='title')return;
  state='inter';
  AudioSys.init();
  $('title').classList.add('hidden');
  $('inter').classList.remove('hidden');
  const cap='CHARLES RENDER, M.D. - NEUROPARTICIPANT THERAPIST\n\nThe office is dark. The crown hums on its stand.\nTonight\'s subject waits in the anteroom of her own skull.\n\nPUT ON THE HEADSET, OR PLAY RIGHT HERE.\nTRIGGER / CLICK - GRAB AND PLACE\nSQUEEZE OR HOLD F - FOCUS BEAM (REPELS THE WORM)\nSTICKS / WASD - MOVE';
  typewriter($('interCap'),cap,16,()=>{
    state='office';
    $('interPrompt').classList.add('show');
    // entering the dream happens by pressing the JACK IN button in the scene
    setTimeout(()=>$('inter').classList.add('hidden'),5200);
  });
}
addEventListener('pointerdown',()=>{
  AudioSys.init();
  if(state==='title')titleAdvance();
  else if(state==='end'){$('endScreen').classList.add('hidden');enterOffice();}
});
addEventListener('keydown',e=>{
  if(state==='title'){AudioSys.init();titleAdvance();}
  else if(state==='end'&&e.code==='Enter'){$('endScreen').classList.add('hidden');enterOffice();}
});

/* VR button */
if(navigator.xr&&navigator.xr.isSessionSupported){
  navigator.xr.isSessionSupported('immersive-vr').then(ok=>{
    if(ok){const b=$('vrBtn');b.style.display='block';
      b.addEventListener('click',async e=>{
        e.stopPropagation();AudioSys.init();
        try{
          const session=await navigator.xr.requestSession('immersive-vr',
            {optionalFeatures:['local-floor','bounded-floor']});
          await renderer.xr.setSession(session);
          if(state==='title')titleAdvance();
          session.addEventListener('end',()=>{hudMesh.visible=false;});
        }catch(err){b.textContent='VR UNAVAILABLE';}
      });
    }
  }).catch(()=>{});
}
renderer.xr.addEventListener('sessionstart',()=>{
  hudMesh.visible=(state==='dream');
  $('title').classList.add('hidden');$('inter').classList.add('hidden');
  if(state==='title')state='office';
});

window.__dm={jack:()=>{state='office';enterOffice();jackIn();},state:()=>state,game};
enterOffice();
state='title';
</script>
